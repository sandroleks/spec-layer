<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spec Layer proposed plugin system</title><style>:root {
  color-scheme: dark;

  /* Typography.
     Steps are named for the ROLE they serve, not their position in a sequence,
     because the bug this replaced was the same role rendering at a different
     size on each screen: a button label was 10px, 10.5px, or 11px depending on
     which screen it sat on. A role name makes that mistake hard to repeat —
     "which size is a button label?" has one answer.

     Whole pixels only. The values this replaced ran to quarter-pixel steps
     (8.75, 9.25, 10.75) where no adjacent pair was tellable apart.

     Floor raised from 8px to 9px: the smallest four roles (micro through
     control) each moved up by 1px, which is why control now equals body. That
     merge is deliberate, not a bug — the same pairing (a control's label at
     the same size as base body copy, distinguished by weight rather than
     size) is how shadcn/ui and most dense desktop UIs size a default vs. large
     button. Section and display were already legible at their sizes and did
     not need to move. Because every consumer reads the role token rather than
     a literal, this floor-raise is a 4-line diff — nothing outside this block
     changed. */
  --sl-font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sl-font-size-micro: 9px; /* keyboard hints, the smallest badges */
  --sl-font-size-caption: 10px; /* hints, counts, secondary <small> */
  --sl-font-size-support: 11px; /* metadata, help text, chips */
  --sl-font-size-control: 12px; /* buttons, control labels, row titles */
  --sl-font-size-body: 12px; /* base body copy */
  --sl-font-size-section: 14px; /* section headings */
  --sl-font-size-display: 20px; /* screen h1 */
  /* No 16px step: the screen h1 sits at 20px and section headings at 14px, so
     nothing in the UI needs one. A role name that nothing uses is how the old
     dead .sl-type-* utilities started, so add it back only with a consumer. */

  /* `none` is for single-line controls that centre their own text; using it
     instead of a ratio keeps an icon and its label on one optical line. */
  --sl-line-height-none: 1;
  --sl-line-height-tight: 1.15;
  --sl-line-height-control: 1.25;
  --sl-line-height-body: 1.4;

  --sl-font-weight-regular: 450;
  --sl-font-weight-medium: 560;
  --sl-font-weight-semibold: 650;
  --sl-font-weight-bold: 720;

  /* Tracking. Small uppercase labels need positive tracking to stay readable;
     large text needs negative tracking to stop looking loose. Both were
     previously literal em values scattered through the pattern layer. */
  --sl-tracking-display: -0.035em; /* 20px page h1 */
  --sl-tracking-tight: -0.01em; /* 11px+ titles */
  --sl-tracking-caps: 0.045em; /* uppercase eyebrows and badges */
  --sl-tracking-caps-wide: 0.07em; /* uppercase section labels */

  /* Spacing.
     A 2px scale, not 4px: with 24/28/34px control heights, 4px steps are too
     coarse to distinguish "tight" from "comfortable" inside a single row. The
     step name is the pixel value, so there is never a question what
     --sl-space-6 resolves to.

     8px is the anchor. Prefer a named step over a literal for any rhythm
     spacing (gap, padding, margin). Two things are deliberately NOT on this
     scale and stay literal in the pattern layer:
       - 1px optical nudges that align an icon or caption to a text baseline.
       - Computed layout values: footer scroll clearance and the nested-row
         indents that align to a control column, which must track the thing
         they align to rather than the rhythm. */
  --sl-space-0: 0;
  --sl-space-2: 2px;
  --sl-space-4: 4px;
  --sl-space-6: 6px;
  --sl-space-8: 8px;
  --sl-space-10: 10px;
  --sl-space-12: 12px;
  --sl-space-14: 14px;
  --sl-space-16: 16px;
  --sl-space-20: 20px;
  --sl-space-24: 24px;
  --sl-space-32: 32px;

  /* Shape */
  --sl-radius-xs: 3px;
  --sl-radius-sm: 4px;
  --sl-radius-md: 7px;
  --sl-radius-lg: 10px;
  --sl-radius-pill: 999px;

  /* Controls */
  --sl-control-xs: 24px;
  --sl-control-sm: 28px;
  --sl-control-md: 34px;
  --sl-control-lg: 36px;
  --sl-touch-target: 36px;

  /* Layout.
     plugin-width/height mirror the figma.showUI() call in src/main.ts, which is
     the source of truth — the iframe is sized by the host, not by CSS. They are
     published here for reference (harness, docs); change main.ts too. */
  --sl-plugin-width: 480px;
  --sl-plugin-height: 680px;
  --sl-sidebar-width: 52px;
  --sl-header-height: 48px;
  --sl-footer-height: 56px;
  --sl-content-max: 680px;

  /* Motion */
  --sl-motion-fast: 120ms;
  --sl-motion-standard: 180ms;
  --sl-motion-slow: 260ms;
  --sl-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --sl-ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* Elevation */
  --sl-shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.18);
  --sl-shadow-menu: 0 10px 30px rgba(0, 0, 0, 0.38);
  --sl-shadow-overlay: 0 18px 54px rgba(0, 0, 0, 0.46);

  /* Dark color roles */
  --sl-color-canvas: #1f1f1f;
  --sl-color-chrome: #232323;
  --sl-color-surface: #292929;
  --sl-color-surface-subdued: #252525;
  --sl-color-surface-raised: #303030;
  --sl-color-surface-hover: #343434;
  --sl-color-surface-pressed: #383838;
  --sl-color-surface-selected: rgba(11, 153, 255, 0.14);
  --sl-color-overlay: rgba(0, 0, 0, 0.62);
  --sl-color-section-header: var(--sl-color-surface);
  --sl-color-detail-surface: var(--sl-color-surface-subdued);
  --sl-color-ai-surface: var(--sl-color-surface-selected);
  --sl-color-ai-border: transparent;

  --sl-color-border: #414141;
  --sl-color-border-muted: #343434;
  --sl-color-border-strong: #505050;
  --sl-color-border-hover: var(--sl-color-border-strong);

  --sl-color-text: #f3f3f3;
  --sl-color-text-muted: #adadad;
  --sl-color-text-quiet: #828282;
  --sl-color-text-disabled: #666666;
  --sl-color-text-on-accent: #ffffff;

  --sl-color-accent: #0b99ff;
  --sl-color-accent-hover: #31a8ff;
  --sl-color-accent-pressed: #0786e0;
  --sl-color-accent-text: #9dccf2;
  --sl-color-accent-soft: rgba(11, 153, 255, 0.14);
  --sl-color-accent-border: rgba(11, 153, 255, 0.25);
  --sl-color-focus: #62b8ff;
  --sl-color-ai-badge-text: var(--sl-color-accent-text);
  --sl-color-ai-badge-bg: var(--sl-color-accent-soft);
  --sl-color-ai-badge-border: var(--sl-color-accent-border);

  --sl-color-success: #73d66d;
  --sl-color-success-soft: rgba(42, 153, 63, 0.16);
  --sl-color-success-border: rgba(115, 214, 109, 0.3);
  /* Library/Foundation row icons: a muted neutral, not a status color. The
     icon is decorative — it identifies what kind of row this is, not whether
     anything is wrong with it — so it must not repaint if success/warning/
     danger are ever retuned for their actual state roles. */
  --sl-color-source-icon: var(--sl-color-text-muted);
  --sl-color-warning: #e2a64f;
  --sl-color-warning-soft: rgba(226, 166, 79, 0.16);
  --sl-color-warning-border: rgba(226, 166, 79, 0.3);
  /* Amber as a filled shape (the quota bar, the allowance ring) rather than as
     text. On dark the text amber already works as a fill, so this matches it.
     On light it cannot: the text amber has to be dark enough to pass AA on
     white, and at that darkness a 5px bar reads brown. Same split, same
     reason as --sl-color-source-icon above. */
  --sl-color-warning-graphic: var(--sl-color-warning);
  --sl-color-danger: #ff716c;
  --sl-color-danger-soft: rgba(255, 113, 108, 0.14);
  --sl-color-danger-border: rgba(255, 113, 108, 0.28);

  --sl-color-control-thumb: #ffffff;
  --sl-shadow-control-thumb: 0 1px 2px rgba(0, 0, 0, 0.28);

  /* Inverse overlays are intentionally theme-independent. */
  --sl-color-tooltip-bg: #111315;
  --sl-color-tooltip-text: #f7f7f8;
  --sl-color-tooltip-border: #383b3f;
}

body[data-theme="dark"] {
  color-scheme: dark;
}

body[data-theme="light"] {
  color-scheme: light;

  --sl-color-canvas: #ffffff;
  --sl-color-chrome: #ffffff;
  --sl-color-surface: #ffffff;
  --sl-color-surface-subdued: #f7f7f7;
  --sl-color-surface-raised: #ffffff;
  --sl-color-surface-hover: #f4f4f4;
  --sl-color-surface-pressed: #ececec;
  --sl-color-surface-selected: #eef7ff;
  --sl-color-overlay: rgba(24, 24, 24, 0.34);
  --sl-color-section-header: #f7f7f7;
  --sl-color-detail-surface: #ffffff;
  --sl-color-ai-surface: #f7f7f7;
  --sl-color-ai-border: #e2e2e2;

  --sl-color-border: #e2e2e2;
  --sl-color-border-muted: #eeeeee;
  --sl-color-border-strong: #8a8a8a;
  --sl-color-border-hover: #c9c9c9;

  --sl-color-text: #242424;
  --sl-color-text-muted: #737373;
  --sl-color-text-quiet: #8a8a8a;
  --sl-color-text-disabled: #aaaaaa;
  --sl-color-text-on-accent: #ffffff;

  --sl-color-accent: #0875c1;
  --sl-color-accent-hover: #0565a8;
  --sl-color-accent-pressed: #04568f;
  --sl-color-accent-text: #0969a8;
  --sl-color-accent-soft: #eef7ff;
  --sl-color-accent-border: #b9ddf5;
  --sl-color-focus: #0875c1;
  --sl-color-ai-badge-text: #737373;
  --sl-color-ai-badge-bg: #ffffff;
  --sl-color-ai-badge-border: #e1e1e1;

  --sl-color-success: #2f7d35;
  --sl-color-success-soft: #edf7ee;
  --sl-color-success-border: #c5e2c7;
  --sl-color-source-icon: var(--sl-color-text-muted);
  --sl-color-warning: #8a5a0a;
  --sl-color-warning-soft: #fff6e6;
  --sl-color-warning-border: #ead1a4;
  /* Lighter than the text amber above so it still reads amber rather than
     brown, dark enough to hold 3.1:1 against the quota bar's track and 3.4:1
     against a white card, which is what WCAG 1.4.11 asks of a non-text shape. */
  --sl-color-warning-graphic: #c9770d;
  --sl-color-danger: #b93b36;
  --sl-color-danger-soft: #fff0ef;
  --sl-color-danger-border: #ebc2bf;

  --sl-shadow-raised: 0 1px 2px rgba(34, 56, 76, 0.08);
  --sl-shadow-menu: 0 10px 30px rgba(34, 56, 76, 0.16);
  --sl-shadow-overlay: 0 18px 54px rgba(34, 56, 76, 0.2);
  --sl-shadow-control-thumb: 0 1px 2px rgba(34, 56, 76, 0.24);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --sl-motion-fast: 0ms;
    --sl-motion-standard: 0ms;
    --sl-motion-slow: 0ms;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  margin: 0;
  color: var(--sl-color-text);
  background: var(--sl-color-canvas);
  font-family: var(--sl-font-family);
  font-size: var(--sl-font-size-body);
  font-weight: var(--sl-font-weight-regular);
  line-height: var(--sl-line-height-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

[hidden] {
  display: none !important;
}

/* The standard visually-hidden clip. Every value here is part of that recipe,
   not spacing: do not route the 1px or the -1px through the spacing scale. */
.sl-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--sl-color-focus);
  outline-offset: 2px;
}







/*
 * Icons in buttons — ONE BUTTON, ONE GLYPH, naming the act the button performs
 * and never changing with the button's state.
 *
 * This is the rule that was actually missing. The failure it fixes was never
 * "primaries have icons": it was one slot holding three different CATEGORIES
 * as its state changed. The Library's primary picked `refresh` while idle,
 * `alertCircle` when checks had failed, and `check` when there was nothing to
 * do — an action, then a warning, then a status, in one button. Removing the
 * glyph made that slot honest but left every footer half-drawn: one button
 * with a pictogram beside one without.
 *
 * - Every footer action carries a glyph, in every state. A busy or disabled
 *   button is still the same button, so "Creating docs…", "Up to date" and
 *   "Select sources to continue" keep the glyph of the act they belong to.
 *   State belongs in the label and in the progress line, not in the glyph.
 * - The two footer primaries are a family: `filePlus` for making docs (the
 *   component and Foundations screens) and `fileCheck` for bringing them up to
 *   date (the Library). Same page outline, so they read as one act on one
 *   object; the plus and the check are what make them acts. Neither reuses
 *   `fileDescription` or `layoutGrid`, which draw the finished OUTPUT and are
 *   also the sidebar's glyphs for those very screens, so a footer wearing one
 *   repeated the tab the user is already looking at.
 * - Conventional pictograms keep their meaning exactly: `refresh` (circular
 *   arrows) is "re-read, writes nothing", `download` is "arrow to tray",
 *   `externalLink` is "arrow out of a box".
 * - Tie-break: when two buttons in one row would claim the same pictogram, it
 *   goes to the one it matches exactly. Circular arrows are "Refresh library",
 *   not the "Update all docs" beside it — which is why update needed a glyph
 *   of its own rather than a second pair of arrows. Two identical glyphs in
 *   one row read as the same button twice.
 * - This says nothing about tone. It is a property of the ACT, not of the
 *   button: a primary "Download" would keep its arrow.
 * - Outside this rule: a SPINNER reports work in flight rather than naming an
 *   act. The license Activate button spins its glyph while checking (see the
 *   animation rule further down) because that form has no progress line. All
 *   three footers have one, so their busy buttons keep their static glyph.
 *
 * Separately, and not part of the principle: leading glyphs in buttons are
 * 15px. They were mixed 15 and 16 within a single row.
 */
.sl-button {
  min-width: 0;
  height: var(--sl-control-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-12);
  color: var(--sl-color-text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-medium);
  line-height: var(--sl-line-height-none);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition:
    color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard),
    border-color var(--sl-motion-fast) var(--sl-ease-standard),
    transform var(--sl-motion-fast) var(--sl-ease-out);
}

.sl-button[data-size="small"] {
  height: var(--sl-control-sm);
  padding-inline: var(--sl-space-8);
  font-size: var(--sl-font-size-support);
}

.sl-button[data-size="large"] {
  height: var(--sl-control-lg);
  padding-inline: var(--sl-space-14);
  font-size: var(--sl-font-size-body);
}

.sl-button[data-tone="primary"] {
  color: var(--sl-color-text-on-accent);
  background: var(--sl-color-accent);
  border-color: var(--sl-color-accent);
}

.sl-button[data-tone="primary"]:hover:not(:disabled) {
  background: var(--sl-color-accent-hover);
  border-color: var(--sl-color-accent-hover);
}

.sl-button[data-tone="primary"]:active:not(:disabled) {
  background: var(--sl-color-accent-pressed);
  border-color: var(--sl-color-accent-pressed);
}

.sl-button[data-tone="secondary"] {
  background: var(--sl-color-surface-raised);
  border-color: var(--sl-color-border);
}

.sl-button[data-tone="secondary"]:hover:not(:disabled) {
  background: var(--sl-color-surface-hover);
  border-color: var(--sl-color-border-strong);
}

.sl-button[data-tone="quiet"] {
  color: var(--sl-color-text-muted);
}

.sl-button[data-tone="quiet"]:hover:not(:disabled) {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
}

.sl-button[data-tone="danger"] {
  color: var(--sl-color-text-on-accent);
  background: var(--sl-color-danger);
  border-color: var(--sl-color-danger);
}

.sl-button:active:not(:disabled) {
  transform: translateY(1px);
}

.sl-button:disabled,
.sl-button[aria-disabled="true"] {
  opacity: 0.48;
  cursor: not-allowed;
}

.sl-icon-button {
  width: var(--sl-control-lg);
  height: var(--sl-control-lg);
  flex: 0 0 auto;
  display: inline-grid;
  place-items: center;
  padding: 0;
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--sl-radius-md);
  cursor: pointer;
  transition:
    color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard),
    transform var(--sl-motion-fast) var(--sl-ease-out);
}

/*
 * theme.ts swaps the theme button's innerHTML for an SVG that carries only a
 * viewBox, discarding whatever size the shell's icon() helper wrote. The size
 * has to come from CSS or the icon paints at its intrinsic 34px while every
 * other icon in the header is 17px.
 */
.sl-icon-button > svg {
  width: 17px;
  height: 17px;
  display: block;
}

.sl-icon-button:hover:not(:disabled) {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
}

.sl-icon-button:active:not(:disabled) > svg {
  transform: scale(0.9);
}

.sl-icon-button[aria-current="page"],
.sl-icon-button[aria-pressed="true"] {
  color: var(--sl-color-accent);
  background: var(--sl-color-surface-selected);
}

.sl-icon-button:disabled {
  color: var(--sl-color-text-disabled);
  cursor: not-allowed;
}

.sl-choice {
  min-width: 0;
  position: relative;
  display: inline-grid;
  grid-template-columns: 16px minmax(0, 1fr);
  align-items: start;
  gap: var(--sl-space-8);
  cursor: pointer;
}

.sl-choice-input,
.sl-switch-input {
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  width: 1px;
  height: 1px;
  transform: translateY(-50%);
  opacity: 0;
  pointer-events: none;
}

.sl-checkbox-box,
.sl-radio-box {
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  color: var(--sl-color-text-on-accent);
  background: transparent;
  border: 1px solid var(--sl-color-border-strong);
  transition:
    background var(--sl-motion-fast) var(--sl-ease-standard),
    border-color var(--sl-motion-fast) var(--sl-ease-standard),
    box-shadow var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-checkbox-box {
  border-radius: var(--sl-radius-sm);
}

.sl-checkbox-box > svg {
  grid-area: 1 / 1;
}

.sl-radio-box {
  border-radius: 50%;
}

.sl-radio-box::after {
  width: 8px;
  height: 8px;
  background: transparent;
  border-radius: 50%;
  content: "";
}

/* The check glyph is always in the markup so the box does not need rebuilding
   on every toggle. Native state decides whether it is visible. */
.sl-choice-input:not(:checked):not([data-mixed="true"]) + .sl-checkbox-box > svg {
  visibility: hidden;
}

.sl-choice-input:checked + .sl-checkbox-box,
.sl-choice-input[data-mixed="true"] + .sl-checkbox-box {
  background: var(--sl-color-accent);
  border-color: var(--sl-color-accent);
}

.sl-choice-input[data-mixed="true"] + .sl-checkbox-box > svg {
  visibility: hidden;
}

.sl-choice-input[data-mixed="true"] + .sl-checkbox-box::after {
  grid-area: 1 / 1;
  width: 8px;
  height: 2px;
  background: var(--sl-color-text-on-accent);
  border-radius: 1px;
  content: "";
}

.sl-choice-input:checked + .sl-radio-box {
  border-color: var(--sl-color-accent);
}

.sl-choice-input:checked + .sl-radio-box::after {
  background: var(--sl-color-accent);
}

.sl-choice-input:focus-visible + .sl-checkbox-box,
.sl-choice-input:focus-visible + .sl-radio-box,
.sl-switch-input:focus-visible + .sl-switch-track {
  box-shadow:
    0 0 0 2px var(--sl-color-canvas),
    0 0 0 4px var(--sl-color-focus);
}

.sl-choice-input:disabled ~ *,
.sl-switch-input:disabled ~ * {
  opacity: 0.45;
  cursor: not-allowed;
}

.sl-choice-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.sl-choice-copy > strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-medium);
  line-height: var(--sl-line-height-control);
}

.sl-choice-copy > small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
}

.sl-switch-control {
  min-height: var(--sl-control-md);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sl-space-12);
  cursor: pointer;
}

.sl-switch-track {
  width: 32px;
  height: 18px;
  /* Without a display rule a <span> track stays inline and drops both the
     width and the height above, collapsing the switch to its thumb. */
  display: inline-block;
  flex: 0 0 auto;
  padding: var(--sl-space-2);
  background: var(--sl-color-border-strong);
  border: 1px solid var(--sl-color-border-strong);
  border-radius: var(--sl-radius-pill);
  transition:
    background var(--sl-motion-standard) var(--sl-ease-standard),
    border-color var(--sl-motion-standard) var(--sl-ease-standard);
}

.sl-switch-thumb {
  width: 12px;
  height: 12px;
  display: block;
  background: var(--sl-color-control-thumb);
  border-radius: 50%;
  box-shadow: var(--sl-shadow-control-thumb);
  transition: transform var(--sl-motion-standard) var(--sl-ease-out);
}

.sl-switch-input:checked + .sl-switch-track {
  background: var(--sl-color-accent);
  border-color: var(--sl-color-accent);
}

.sl-switch-input:checked + .sl-switch-track .sl-switch-thumb {
  transform: translateX(14px);
}

.sl-chip {
  min-height: var(--sl-control-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-8);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  cursor: pointer;
}

.sl-chip:hover:not(:disabled) {
  color: var(--sl-color-text);
  border-color: var(--sl-color-border-strong);
}

.sl-chip[aria-pressed="true"] {
  color: var(--sl-color-accent);
  background: var(--sl-color-surface-selected);
  border-color: var(--sl-color-accent);
}

.sl-chip:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Variant values reuse the chip shape as read-only labels, not controls. */
.sl-variant-chip {
  min-height: 22px;
  padding: 0 var(--sl-space-8);
  cursor: default;
}

.sl-variant-chip[data-tone="flag"] {
  color: var(--sl-color-text);
  background: transparent;
}

.sl-variant-chip[data-tone="muted"] {
  color: var(--sl-color-text-quiet);
  background: var(--sl-color-surface-subdued);
}

/* Keep an enum value attributed to its axis while letting the value lead. */
.sl-chip-axis {
  margin-right: var(--sl-space-4);
  color: var(--sl-color-text-muted);
}

.sl-segmented {
  min-height: var(--sl-control-sm);
  display: inline-flex;
  padding: var(--sl-space-2);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-segmented > button {
  min-width: 0;
  height: 24px;
  padding: 0 var(--sl-space-10);
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-sm);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  cursor: pointer;
}

.sl-segmented > button:hover:not(:disabled):not([aria-checked="true"]) {
  color: var(--sl-color-text);
}

.sl-segmented > button[aria-checked="true"],
.sl-segmented > button[aria-selected="true"] {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-raised);
  box-shadow: var(--sl-shadow-raised);
}

.sl-field {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sl-space-6);
}

.sl-field-label {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
}

.sl-input-wrap,
.sl-select-wrap {
  min-width: 0;
  min-height: var(--sl-control-md);
  display: flex;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-10);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  transition:
    border-color var(--sl-motion-fast) var(--sl-ease-standard),
    box-shadow var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-input-wrap:focus-within,
.sl-select-wrap:focus-within {
  border-color: var(--sl-color-focus);
  box-shadow: 0 0 0 1px var(--sl-color-focus);
}

.sl-input-wrap input,
.sl-select-wrap select {
  min-width: 0;
  width: 100%;
  height: 32px;
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  outline: 0;
  font-size: var(--sl-font-size-control);
}

.sl-input-wrap input::placeholder {
  color: var(--sl-color-text-quiet);
}

.sl-field-help {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
}

.sl-field[data-invalid="true"] .sl-input-wrap {
  border-color: var(--sl-color-danger);
}

.sl-field[data-invalid="true"] .sl-field-help {
  color: var(--sl-color-danger);
}

.sl-badge {
  min-height: 18px;
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-4);
  padding: 0 var(--sl-space-6);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-pill);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
  line-height: var(--sl-line-height-none);
  white-space: nowrap;
}

.sl-badge[data-tone="accent"] {
  color: var(--sl-color-accent);
  background: var(--sl-color-accent-soft);
  border-color: transparent;
}

.sl-badge[data-tone="success"] {
  color: var(--sl-color-success);
  background: var(--sl-color-success-soft);
  border-color: transparent;
}

.sl-badge[data-tone="warning"] {
  color: var(--sl-color-warning);
  background: var(--sl-color-warning-soft);
  border-color: transparent;
}

.sl-badge[data-tone="danger"] {
  color: var(--sl-color-danger);
  background: var(--sl-color-danger-soft);
  border-color: transparent;
}

.sl-status {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-6);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  white-space: nowrap;
}

.sl-status::before {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  background: currentColor;
  border-radius: 50%;
  content: "";
}

.sl-status[data-tone="accent"] {
  color: var(--sl-color-accent);
}

.sl-status[data-tone="success"] {
  color: var(--sl-color-success);
}

.sl-status[data-tone="warning"] {
  color: var(--sl-color-warning);
}

.sl-status[data-tone="danger"] {
  color: var(--sl-color-danger);
}

.sl-card {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-lg);
}

.sl-banner {
  min-height: 38px;
  display: flex;
  align-items: flex-start;
  gap: var(--sl-space-8);
  padding: var(--sl-space-8) var(--sl-space-10);
  color: var(--sl-color-text);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
}

.sl-banner[data-tone="success"] {
  background: var(--sl-color-success-soft);
  border-color: var(--sl-color-success);
}

.sl-banner[data-tone="warning"] {
  background: var(--sl-color-warning-soft);
  border-color: var(--sl-color-warning);
}

.sl-banner[data-tone="danger"] {
  background: var(--sl-color-danger-soft);
  border-color: var(--sl-color-danger);
}

.sl-tooltip {
  position: absolute;
  z-index: 50;
  max-width: 240px;
  padding: var(--sl-space-6) var(--sl-space-8);
  color: var(--sl-color-tooltip-text);
  background: var(--sl-color-tooltip-bg);
  border: 1px solid var(--sl-color-tooltip-border);
  border-radius: var(--sl-radius-sm);
  box-shadow: var(--sl-shadow-menu);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
  pointer-events: none;
  opacity: 0;
  transform: translateX(-4px);
  transition:
    opacity var(--sl-motion-fast) var(--sl-ease-standard),
    transform var(--sl-motion-fast) var(--sl-ease-out);
}

[data-tooltip-trigger]:hover > .sl-tooltip,
[data-tooltip-trigger] > :focus-visible ~ .sl-tooltip,
.sl-tooltip[data-open="true"] {
  opacity: 1;
  transform: translateX(0);
}

.sl-menu {
  min-width: 174px;
  padding: var(--sl-space-4);
  color: var(--sl-color-text);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  box-shadow: var(--sl-shadow-menu);
}

.sl-menu-item {
  width: 100%;
  min-height: 30px;
  display: flex;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-8);
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-sm);
  font-size: var(--sl-font-size-control);
  text-align: left;
  cursor: pointer;
}

.sl-menu-item:hover:not(:disabled),
.sl-menu-item:focus-visible {
  background: var(--sl-color-surface-hover);
}

.sl-menu-item[data-tone="danger"] {
  color: var(--sl-color-danger);
}

.sl-menu-separator {
  height: 1px;
  margin: var(--sl-space-4);
  background: var(--sl-color-border-muted);
}

.sl-disclosure {
  overflow: clip;
  border-bottom: 1px solid var(--sl-color-border-muted);
}

.sl-disclosure-trigger {
  width: 100%;
  min-height: 42px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.sl-disclosure-trigger > [data-chevron] {
  transition: transform var(--sl-motion-standard) var(--sl-ease-out);
}

.sl-disclosure-trigger[aria-expanded="true"] > [data-chevron] {
  transform: rotate(180deg);
}

.sl-disclosure-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition:
    grid-template-rows var(--sl-motion-standard) var(--sl-ease-out),
    opacity var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-disclosure-panel > div {
  min-height: 0;
  overflow: hidden;
}

.sl-disclosure-trigger[aria-expanded="true"] + .sl-disclosure-panel {
  grid-template-rows: 1fr;
  opacity: 1;
}

.sl-skeleton {
  display: block;
  overflow: hidden;
  background: var(--sl-color-surface);
  border-radius: var(--sl-radius-sm);
  animation: sl-skeleton-pulse 1.4s ease-in-out infinite;
}

.sl-spinner {
  animation: sl-spin 0.75s linear infinite;
}

@keyframes sl-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes sl-skeleton-pulse {
  50% {
    opacity: 0.55;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sl-skeleton,
  .sl-spinner {
    animation: none;
  }
}

.sl-plugin-shell {
  width: 100%;
  height: 100%;
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--sl-sidebar-width) minmax(0, 1fr);
  grid-template-rows: var(--sl-header-height) minmax(0, 1fr);
  color: var(--sl-color-text);
  background: var(--sl-color-canvas);
  overflow: hidden;
}

.sl-utility-header {
  grid-column: 1 / -1;
  grid-row: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--sl-space-10);
  padding: 0 var(--sl-space-8);
  background: var(--sl-color-chrome);
  border-bottom: 1px solid var(--sl-color-border);
}

/*
 * The header's three controls are unboxed. Three outlined boxes in a 48px bar
 * out-shouted the screen title underneath them, so the bar separates them with
 * space and paints a surface only under the pointer, which is what
 * approved-direction.md asks for everywhere else.
 *
 * Each keeps a transparent 1px border rather than dropping the border, so a
 * hover cannot reflow the row. Keyboard users are covered by the global
 * :focus-visible ring in components.css, not by a resting outline.
 */
.sl-header-search {
  min-width: 40px;
  height: var(--sl-control-lg);
  flex: 0 1 auto;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-6);
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--sl-radius-md);
  cursor: pointer;
}

.sl-header-search:hover {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
}

.sl-header-search > span {
  overflow: hidden;
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sl-ai-allowance {
  min-width: 0;
  height: var(--sl-control-lg);
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-6);
  color: var(--sl-color-text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--sl-radius-md);
  cursor: pointer;
}

.sl-ai-allowance:hover {
  background: var(--sl-color-surface-hover);
}

.sl-allowance-summary {
  min-width: 0;
  height: 100%;
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-6);
  padding: 0;
  color: inherit;
  background: transparent;
  border: 0;
  cursor: pointer;
}

/*
 * Holds the ring and the Pro check in the same 20px cell, so swapping between
 * them cannot change the control's column count or its width.
 */
.sl-allowance-status {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
}

/*
 * A ring is a gauge, and an unlimited plan has no quantity to gauge, so Pro
 * gets a plain check in the ring's place. Green to agree with the License
 * page's Active badge, which is the same fact stated twice.
 */
.sl-allowance-pro-mark {
  display: none;
  color: var(--sl-color-success);
}

.sl-ai-allowance[data-state="pro"] .sl-allowance-ring {
  display: none;
}

.sl-ai-allowance[data-state="pro"] .sl-allowance-pro-mark {
  display: grid;
}

/*
 * 20px, not 28px. At 28px with a 4-unit stroke the ring was the loudest object
 * on the screen while reporting a number the text beside it already gives. Both
 * values below are viewBox-space, so the r=10 geometry in header.ts and its
 * RING_CIRCUMFERENCE are unaffected by the display size.
 */
.sl-allowance-ring {
  width: 20px;
  height: 20px;
  display: block;
  transform: rotate(-90deg);
}

.sl-allowance-ring [data-track] {
  fill: none;
  stroke: var(--sl-color-border-strong);
  stroke-width: 3;
}

.sl-allowance-ring [data-value] {
  fill: none;
  stroke: var(--sl-color-accent);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dashoffset var(--sl-motion-slow) var(--sl-ease-out);
}

.sl-ai-allowance[data-state="low"] [data-value],
.sl-ai-allowance[data-state="exhausted"] [data-value] {
  stroke: var(--sl-color-warning-graphic);
}

.sl-ai-allowance[data-state="unknown"] [data-value] {
  stroke: var(--sl-color-text-quiet);
}

/*
 * One line, not two. Two type sizes stacked inside a 48px bar read as a card
 * that had been dropped into the chrome. Laid out as a row, the label can go
 * quiet and the number it qualifies can carry the emphasis, which is the
 * reverse of the stacked version.
 */
.sl-allowance-copy {
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: var(--sl-space-4);
  text-align: left;
}

.sl-allowance-copy > strong {
  flex: 0 0 auto;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  line-height: var(--sl-line-height-tight);
  white-space: nowrap;
}

.sl-allowance-copy > small {
  overflow: hidden;
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-tight);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/*
 * Purely visual: the summary button carries its own aria-label, so assistive
 * tech never reaches this text and cannot read the separator as a word.
 */
.sl-allowance-copy > small::before {
  content: "\00b7";
  margin-right: var(--sl-space-4);
  color: var(--sl-color-text-quiet);
}

/*
 * Pro has no second half to qualify, so allowanceCopy leaves the detail empty
 * and the row collapses to one string. Without this the separator would still
 * paint, leaving a stray dot after the label.
 */
.sl-allowance-copy > small:empty {
  display: none;
}

/* With the detail gone, the label is the whole message and stops being a label. */
.sl-ai-allowance[data-state="pro"] .sl-allowance-copy > strong {
  color: var(--sl-color-text);
}

.sl-allowance-action {
  flex: 0 0 auto;
  padding: 0;
  color: var(--sl-color-accent);
  background: transparent;
  border: 0;
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-semibold);
  white-space: nowrap;
  cursor: pointer;
}

.sl-allowance-action:hover {
  text-decoration: underline;
}

.sl-sidebar {
  grid-column: 1;
  grid-row: 2;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--sl-space-8) 0 var(--sl-space-8);
  background: var(--sl-color-chrome);
  border-right: 1px solid var(--sl-color-border);
}

.sl-sidebar-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sl-space-6);
}

.sl-sidebar-separator {
  width: 28px;
  height: 1px;
  margin: var(--sl-space-8) 0;
  background: var(--sl-color-border);
}

.sl-sidebar-spacer {
  flex: 1 1 auto;
}

.sl-sidebar-item {
  position: relative;
}

.sl-sidebar-item > .sl-tooltip {
  top: 50%;
  left: 43px;
  transform: translate(-4px, -50%);
}

.sl-sidebar-item:hover > .sl-tooltip,
.sl-sidebar-item > .sl-icon-button:focus-visible + .sl-tooltip {
  transform: translate(0, -50%);
}

/*
 * A dot, at one fixed size. It used to be a pill holding a live count, so it
 * changed width as the number grew (1 to 2 to 3 as source checks landed) and
 * nudged the icon it sits on. Nothing about it is typographic now: no padding
 * for digits, no min-width, no font.
 */
.sl-sidebar-badge {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 10px;
  height: 10px;
  background: var(--sl-color-accent);
  border: 2px solid var(--sl-color-chrome);
  border-radius: var(--sl-radius-pill);
}

.sl-screen {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--sl-color-canvas);
}

.sl-page-header {
  min-height: 67px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sl-space-12);
  padding: var(--sl-space-10) var(--sl-space-12) var(--sl-space-8) var(--sl-space-14);
}

.sl-page-header-copy {
  min-width: 0;
}

.sl-page-header-copy > small {
  display: block;
  margin-bottom: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-caps);
  text-transform: uppercase;
}

.sl-page-header-copy > h1 {
  margin: 0;
  overflow: hidden;
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-display);
  font-weight: var(--sl-font-weight-bold);
  line-height: var(--sl-line-height-tight);
  letter-spacing: var(--sl-tracking-display);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sl-page-header-copy > p {
  margin: var(--sl-space-4) 0 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
}

.sl-screen-scroll {
  min-height: 0;
  overflow-y: auto;
  padding: 0 var(--sl-space-14) var(--sl-space-20);
  scrollbar-width: thin;
  scrollbar-color: var(--sl-color-border-strong) transparent;
}

.sl-screen-footer {
  min-height: var(--sl-footer-height);
  display: grid;
  align-content: center;
  gap: var(--sl-space-6);
  padding: var(--sl-space-8) var(--sl-space-12);
  background: var(--sl-color-chrome);
  border-top: 1px solid var(--sl-color-border);
  /* Containing block for .sl-footer-progress, which floats above this band
     rather than sitting in the grid. See that rule. */
  position: relative;
}

/*
 * Every footer button hugs its label and the row sits right. No `flex` and no
 * `min-width` on any of them: the foundations primary used to take `flex: 1`
 * and stretch across the footer while the same slot on the other two screens
 * hugged, and a 118px floor here padded short labels out to a width they had
 * not earned. Labels are stable enough to hug now that no primary counts
 * anything (see docs/plugin-voice-and-copy.md, "Footer actions").
 */
.sl-footer-actions {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sl-space-6);
}

.sl-footer-actions > .sl-button {
  height: 30px;
  gap: var(--sl-space-6);
  padding-inline: var(--sl-space-10);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
}

/*
 * Floats above the footer instead of taking a row inside it.
 *
 * As a grid row this changed the footer's own height the moment any work
 * started: on the Library a refresh took it from 56px to 106px, which shrank
 * the scroll viewport by the same 50px, reflowed the whole list, and moved both
 * buttons out from under the cursor. Nothing about starting a refresh should
 * relayout the screen behind it.
 *
 * So the footer stays a fixed band whatever is happening, and this sits over
 * the last of the list as a floating status card, which .sl-work-status already
 * looks like (its own surface, border and radius). The list carries bottom
 * clearance for the footer, so at the end of a scroll it usually covers nothing
 * at all. It needs no z-index: it comes after .sl-screen-scroll in the DOM, so
 * it paints above the rows while staying under the Library's overflow menu and
 * scrim, which are positioned with z-index of their own.
 */
.sl-footer-progress {
  min-width: 0;
  position: absolute;
  left: var(--sl-space-12);
  right: var(--sl-space-12);
  bottom: calc(100% + var(--sl-space-6));
}

.sl-footer-progress .sl-work-status {
  padding: var(--sl-space-8) var(--sl-space-8);
}

/*
 * Only the placement. .sl-icon-button already resolves to a transparent
 * control with a hover surface and --sl-radius-md, which is what the rail's
 * buttons use; the boxing this rule used to add was the header's alone.
 */
.sl-utility-header > .sl-icon-button {
  margin-left: auto;
}

.sl-component-screen .sl-screen-scroll {
  overflow-x: hidden;
  padding: 0 0 var(--sl-space-16);
  scroll-padding-block: var(--sl-space-12);
}

.sl-component-controls {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.sl-ai-control {
  min-height: 44px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 31px;
  align-items: center;
  gap: var(--sl-space-8);
  margin: 0 var(--sl-space-12) var(--sl-space-8) var(--sl-space-14);
  padding: 0 var(--sl-space-10);
  background: var(--sl-color-ai-surface);
  border: 1px solid var(--sl-color-ai-border);
  border-radius: var(--sl-radius-md);
}

.sl-ai-control-copy {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-6);
}

.sl-ai-control-copy > strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-ai-control-copy .sl-icon-button {
  width: 20px;
  height: 20px;
  border-radius: var(--sl-radius-sm);
}

.sl-ai-control .sl-switch-control {
  min-height: 18px;
}

.sl-ai-control .sl-switch-track {
  width: 31px;
  height: 18px;
  padding: var(--sl-space-2);
  border: 0;
}

.sl-ai-control .sl-switch-thumb {
  width: 14px;
  height: 14px;
}

.sl-ai-control .sl-switch-input:checked + .sl-switch-track .sl-switch-thumb {
  transform: translateX(13px);
}

.sl-section-intro {
  min-height: 31px;
  display: flex;
  align-items: center;
  margin: 0;
  padding: var(--sl-space-6) var(--sl-space-14) var(--sl-space-8);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-caps);
  text-transform: uppercase;
}

.sl-component-screen .sl-section-group {
  margin: 0 var(--sl-space-12) var(--sl-space-8);
  overflow: hidden;
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border-muted);
  border-radius: var(--sl-radius-md);
  transition:
    border-color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-component-screen .sl-section-group:hover {
  border-color: var(--sl-color-border-hover);
}

.sl-section-group-header {
  min-width: 0;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  align-items: center;
  gap: 0;
  min-height: 44px;
  padding: 0 var(--sl-space-6) 0 var(--sl-space-8);
  background: var(--sl-color-section-header);
  transition: background var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-section-group-header:hover,
.sl-section-group-header:focus-within {
  background: var(--sl-color-surface-hover);
}

.sl-section-group .sl-disclosure-trigger {
  min-width: 0;
  min-height: 42px;
  grid-template-columns: minmax(0, 1fr) auto 17px;
  padding: 0 var(--sl-space-2) 0 0;
  background: transparent;
  border-radius: var(--sl-radius-sm);
}

.sl-section-group-header[data-expanded="true"] + .sl-disclosure-panel {
  grid-template-rows: 1fr;
  opacity: 1;
}

.sl-section-group-title {
  display: flex;
  align-items: center;
  gap: var(--sl-space-8);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-tight);
}

.sl-section-count {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-medium);
}

.sl-section-rows {
  padding: 0;
}

.sl-section-row {
  min-height: 41px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0;
  padding: 0;
  border-top: 1px solid var(--sl-color-border-muted);
  border-bottom: 0;
  border-radius: 0;
  transition:
    color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-section-row:not(.is-disabled):hover {
  background: var(--sl-color-surface-hover);
}

.sl-section-row .sl-choice {
  width: 100%;
  min-height: 40px;
  align-items: center;
  gap: var(--sl-space-8);
  grid-template-columns: 16px minmax(0, 1fr) auto;
  /* Child controls begin beneath the category title, not its bulk checkbox. */
  padding: var(--sl-space-8) var(--sl-space-10) var(--sl-space-8) 40px;
}

.sl-section-row .sl-choice-copy > strong {
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-medium);
  letter-spacing: var(--sl-tracking-tight);
}

.sl-section-details {
  display: grid;
  gap: var(--sl-space-8);
  /* 63px aligns detail copy with the child row's label, one step past the
     40px child indent. Computed alignment, not rhythm: it tracks the control
     column, so it stays literal rather than snapping to the spacing scale. */
  padding: var(--sl-space-4) var(--sl-space-10) var(--sl-space-10) 63px;
  background: var(--sl-color-detail-surface);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-section-option-label {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-caps);
  text-transform: uppercase;
}

/* The " · <note>" that trails an option's name. */
.sl-section-option-note {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
}

.sl-component-screen .sl-section-row .sl-badge[data-tone="accent"] {
  min-width: 20px;
  min-height: 0;
  height: 16px;
  padding: 0 var(--sl-space-4);
  color: var(--sl-color-ai-badge-text);
  background: var(--sl-color-ai-badge-bg);
  border: 1px solid var(--sl-color-ai-badge-border);
  border-radius: var(--sl-radius-sm);
  font-size: var(--sl-font-size-micro);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-caps);
}

.sl-chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sl-space-6);
}

.sl-option-chip {
  min-height: 30px;
  gap: var(--sl-space-6);
  color: var(--sl-color-text-muted);
  background: transparent;
  border-color: var(--sl-color-border-strong);
}

.sl-option-chip[aria-pressed="true"] {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-selected);
  border-color: var(--sl-color-accent);
}

.sl-option-chip[aria-disabled="true"] {
  cursor: default;
}

.sl-option-check {
  width: 13px;
  height: 13px;
  display: grid;
  place-items: center;
  opacity: 0;
}

.sl-option-chip[aria-pressed="true"] .sl-option-check {
  color: var(--sl-color-accent);
  opacity: 1;
}

.sl-choice-copy.sl-chip-group {
  flex-direction: row;
  align-items: center;
}

.sl-variant-picker {
  overflow: hidden;
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border-muted);
  border-radius: var(--sl-radius-md);
}

.sl-variant-picker-header {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  align-items: center;
  min-height: 42px;
  padding: 0 var(--sl-space-6) 0 var(--sl-space-8);
  transition: background var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-variant-picker-header:hover,
.sl-variant-picker-header:focus-within {
  background: var(--sl-color-surface-hover);
}

.sl-variant-picker .sl-disclosure-trigger {
  min-height: 40px;
  padding: 0 var(--sl-space-2) 0 0;
  background: transparent;
}

.sl-variant-picker .sl-section-rows {
  max-height: 220px;
  overflow-y: auto;
}

.sl-variant-picker .sl-disclosure-panel:not([hidden]) {
  grid-template-rows: 1fr;
  opacity: 1;
}

.sl-bulk-checkbox {
  width: 28px;
  height: 32px;
  position: relative;
  display: grid;
  place-items: center;
  border-radius: var(--sl-radius-sm);
  cursor: pointer;
}

.sl-bulk-checkbox:hover {
  background: var(--sl-color-accent-soft);
}

.sl-library-screen .sl-page-header {
  min-height: 48px;
  padding: var(--sl-space-10) var(--sl-space-12) var(--sl-space-6) var(--sl-space-14);
}

.sl-library-screen .sl-screen-scroll {
  overflow-x: hidden;
  padding: 0;
}

.sl-library-filters {
  width: max-content;
  min-height: 34px;
  display: flex;
  align-items: stretch;
  gap: var(--sl-space-2);
  margin: 0 var(--sl-space-12) var(--sl-space-10) var(--sl-space-14);
  padding: var(--sl-space-4);
  background: var(--sl-color-chrome);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-library-filters > button {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-10);
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-medium);
  cursor: pointer;
}

.sl-library-filters > button:hover {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
}

.sl-library-filters > button.is-selected {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
  box-shadow: var(--sl-shadow-raised);
}

/* Updates gets no accent of its own. The count is the signal; painting the
   tab and its number blue made a "0" look like something to act on. All three
   tabs now share one selected and one count style. */
.sl-library-filters small {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
}

.sl-library-list {
  /* 68px clears the sticky footer so the last row can scroll fully into
     view. Computed layout, not rhythm: it tracks --sl-footer-height, and it
     is the same clearance .sl-foundation-list uses for the same footer.
     No left/right padding — rows run edge-to-edge and carry their own
     inset (see .sl-library-summary), so hover/border spans the full row
     width instead of reading as an inset card. */
  padding: 0 0 68px;
}

.sl-library-row {
  position: relative;
  /* Bottom hairline only, exactly like .sl-foundation-row. A 1px transparent
     border on all four sides used to reserve room for the expanded state's
     accent border, but it also pushed every collapsed row's content 1px right
     and made the row 1px taller than the foundation row it sits beside — a
     visible misalignment between two lists that show the same sources. Nothing
     needs reserving now: the expanded state has no border of its own, so every
     row keeps this same geometry open or closed. */
  border-bottom: 1px solid var(--sl-color-border-muted);
  transition:
    border-color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-library-row:hover {
  background: var(--sl-color-surface-hover);
}

/* An open row is still a row — there is deliberately no `.is-expanded` box
   here. It used to pull itself in with margins and float on a raised surface
   behind a rounded accent border, which cost three things: the list lost its
   single left edge, one row read as a different KIND of object than its
   neighbours, and a strong accent border is the treatment :focus-visible uses,
   so an open disclosure looked selected. Expanded now only adds height. What
   says "open" is the rotated chevron and the Changes section itself, which is
   what the user just clicked to see.

   Hover is the one thing the old card fill was silently doing: an equal
   specificity background beat .sl-library-row:hover, so an open row had no
   hover at all. Rather than let the fill now flash across the full detail
   block, the hover band stays on the summary — the part that is actually the
   row's control. The details below are content, not a target. */
.sl-library-row.is-expanded:hover {
  background: none;
}

.sl-library-row.is-expanded:hover .sl-library-summary {
  background: var(--sl-color-surface-hover);
}

.sl-library-summary {
  min-height: 49px;
  display: grid;
  /* 55px for the timestamp, measured rather than guessed: at 11px this fits
     every label formatLibraryAge can produce short of four-digit days —
     "just now" (48px), "59m ago" (50px), "365d ago" (55px). The column was
     40px, which wrapped all of those onto two lines. It stays a FIXED width,
     not auto: column 1 absorbs the slack, so a fixed timestamp is what keeps
     the status column's right edge on one x across every row, and status is
     the column the eye actually scans down. */
  grid-template-columns: minmax(0, 1fr) auto 55px 28px;
  align-items: center;
  /* Tighter than the row's other gaps: the identity column is the one thing
     here competing for width against a fixed-width status/timestamp/menu run,
     so it gets the space back rather than sharing the standard rhythm. */
  gap: var(--sl-space-4);
  /* Horizontal inset lives on the row content itself (matches
     .sl-foundation-summary's 14px), so collapsed rows stay full-bleed while
     the checkbox/icon column stays clear of the panel edge. */
  padding: var(--sl-space-6) var(--sl-space-14);
}

.sl-library-jump {
  min-width: 0;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-4);
  /* No left padding. This used to reserve the foundation row's checkbox column
     (18px + 4px gap) so the two lists' ICONS shared an x — but a library row
     has no checkbox, so all that reserved space did was indent the row's first
     visible element 22px further from the panel edge than the foundation row's,
     which is the difference the eye actually catches when moving between the
     two screens. Both lists now start their content at the summary's own 14px
     inset. */
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.sl-library-jump:hover .sl-library-identity > strong {
  color: var(--sl-color-accent);
}

.sl-library-source-icon {
  display: grid;
  place-items: center;
  color: var(--sl-color-source-icon);
}

.sl-library-identity {
  min-width: 0;
}

/* Single-line by design. The row used to carry a source subtitle under the
   title, but it either repeated the title outright or pointed at a page the
   user is already looking at — you don't need a locator in the list you
   navigated to. The global search palette keeps its subtitle, because there
   results mix docs and foundations with no surrounding context. */
.sl-library-identity > strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-library-status,
.sl-library-update-disclosure {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-6);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  white-space: nowrap;
}

.sl-library-status > i {
  width: 6px;
  height: 6px;
  flex: none;
  background: currentColor;
  border-radius: 50%;
}

.sl-library-status.is-updateAvailable {
  color: var(--sl-color-accent);
}

.sl-library-status.is-inSync {
  color: var(--sl-color-success);
}

.sl-library-status.is-edited {
  color: var(--sl-color-warning);
}

.sl-library-status.is-orphaned {
  color: var(--sl-color-danger);
}

.sl-library-status.is-pending,
.sl-library-status.is-unavailable {
  color: var(--sl-color-text-quiet);
}

.sl-library-update-disclosure {
  min-width: 0;
  gap: var(--sl-space-4);
  padding: var(--sl-space-4);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-sm);
  cursor: pointer;
}

.sl-library-update-disclosure:hover {
  background: var(--sl-color-accent-soft);
}

.sl-library-chevron {
  display: inline-flex;
  color: var(--sl-color-text-muted);
  transition: transform var(--sl-motion-standard) var(--sl-ease-standard);
}

.sl-library-chevron.is-expanded {
  transform: rotate(180deg);
}

.sl-library-summary > time {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  text-align: right;
  /* A timestamp is a single token — breaking "10h ago" after the number reads
     as two facts. No ellipsis to go with it: at four-digit days the text bleeds
     into the 4px column gap, which is cheaper than truncating a real number. */
  white-space: nowrap;
}

.sl-library-menu-trigger {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-md);
  cursor: pointer;
}

.sl-library-menu-trigger:hover {
  color: var(--sl-color-text);
  background: var(--sl-color-surface);
}

.sl-library-details-inner {
  min-height: 0;
  /* The row's own inset, the same 14px .sl-library-summary uses, so the details
     sit on the one left edge the whole list shares. This used to be 36px on the
     left and 10px on the right — an indent hung under the row title, past the
     source icon, and lopsided in a panel this narrow. That alignment only made
     sense while the expanded state was an inset card; on a full-bleed row it
     just pushed the change blocks off the list's edge. */
  padding: 0 var(--sl-space-14) var(--sl-space-10);
  /* Full-bleed divider: padding does not move a border-top, so this spans the
     row exactly like the hairlines between rows, and shares their token. */
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-library-details-inner > h2 {
  min-height: 34px;
  display: flex;
  align-items: center;
  margin: 0;
  padding: var(--sl-space-8) 0 var(--sl-space-6);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-library-change-list {
  display: grid;
  gap: var(--sl-space-6);
}

.sl-library-change-group,
.sl-library-change-fallback {
  padding: var(--sl-space-8) var(--sl-space-8);
  background: var(--sl-color-surface-subdued);
  border: 1px solid var(--sl-color-border-muted);
  border-radius: var(--sl-radius-md);
}

.sl-library-change-group > strong {
  font-size: var(--sl-font-size-support);
}

.sl-library-change-group > ul {
  margin: var(--sl-space-6) 0 0;
  padding-left: var(--sl-space-14);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-library-change-group > ul > li + li {
  margin-top: var(--sl-space-4);
}

.sl-library-change-scope {
  display: block;
  color: var(--sl-color-text-quiet);
}

.sl-library-change-fallback {
  min-height: 50px;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: start;
  gap: var(--sl-space-8);
  padding: var(--sl-space-8);
  color: var(--sl-color-text-muted);
}

.sl-library-change-fallback > svg {
  /* Optical: drops the icon onto the first text baseline. Not rhythm. */
  margin-top: 1px;
  color: var(--sl-color-warning);
}

.sl-library-change-fallback strong,
.sl-library-change-fallback small {
  display: block;
}

.sl-library-change-fallback strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-library-change-fallback small {
  margin-top: var(--sl-space-4);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-library-menu-scrim {
  position: fixed;
  z-index: 15;
  inset: var(--sl-header-height) 0 0 var(--sl-sidebar-width);
  padding: 0;
  background: transparent;
  border: 0;
}

.sl-library-overflow-menu {
  width: 194px;
  position: absolute;
  z-index: 20;
  /* Opens below the summary band. This is the preferred position only:
     .sl-screen-scroll clips absolutely positioned descendants, so
     placeOpenRowMenu() in screens/library.ts overrides `top` inline when the
     menu would not fit below the row — keep the two in step. */
  top: 42px;
  right: 4px;
  padding: var(--sl-space-6);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  box-shadow: var(--sl-shadow-menu);
}

.sl-library-overflow-menu > button {
  width: 100%;
  min-height: 30px;
  display: flex;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-8);
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-sm);
  font-size: var(--sl-font-size-support);
  text-align: left;
  cursor: pointer;
}

.sl-library-overflow-menu > button:hover:not(:disabled) {
  background: var(--sl-color-surface-hover);
}

.sl-library-overflow-menu > button:disabled {
  opacity: 0.42;
  cursor: default;
}

.sl-library-overflow-menu > button.is-danger {
  color: var(--sl-color-danger);
}

.sl-library-menu-separator {
  height: 1px;
  display: block;
  margin: var(--sl-space-4);
  background: var(--sl-color-border);
}

.sl-library-screen .sl-empty-state {
  min-height: 260px;
}

/*
 * The Publish for developers screen's body (see screens/publish.ts).
 *
 * This block used to style a section appended after the Library's row list,
 * and it carried a top border to divide itself from that list. As a screen
 * body it is the only thing in the scroll region, so that border would be a
 * stray line under the page header and the top margin a gap before nothing.
 *
 * Its height still varies with state (lede alone, or lede + command box +
 * actions + hint + status line), which is why the content stays here in
 * .sl-screen-scroll and only the single primary sits in .sl-screen-footer.
 * That footer is a fixed-height band in the screen grid's content-sized row
 * (see .sl-screen-footer and .sl-footer-progress above): anything
 * variable-height landing inside the footer grid grows it and shrinks the
 * scroll viewport out from under the cursor.
 */
.sl-publish-body {
  min-width: 0;
  padding: var(--sl-space-4) var(--sl-space-14) var(--sl-space-16);
}

/*
 * Two groups: what publishing does, and the key developers need. The rule
 * between them appears only when the second one does, so a library that has
 * never been published shows one group and no stray divider.
 */
.sl-publish-group + .sl-publish-group {
  margin-top: var(--sl-space-16);
  padding-top: var(--sl-space-16);
  border-top: 1px solid var(--sl-color-border-muted);
}

/*
 * The shared heading block's `p` has `margin: 0`, which was safe while every
 * screen using it rendered exactly one paragraph. This screen renders a second
 * one before the first publish, so the two need separating. Scoped here rather
 * than added to `.sl-settings-section-heading p`, which Settings and License
 * also use.
 */
.sl-publish-group .sl-settings-section-heading p + p {
  margin-top: var(--sl-space-8);
}

/*
 * Back control, before .sl-page-header-copy, centred on the TITLE'S LINE rather
 * than on the header's top edge.
 *
 * The page header is `align-items: flex-start` so screens carrying an eyebrow
 * or a subtitle keep their block top-aligned, which is also what puts every
 * screen's h1 at the same y. The back control has to meet that h1 where it
 * already is rather than move it: switching this header to `align-items:
 * center` would drop the title 13px and make it jump on the way in from the
 * Library.
 *
 * Top-aligned, though, a 36px control against a 23px line box is centred 6.5px
 * low, so the chevron read as sitting under the title instead of beside it. It
 * takes the small control size and lifts itself by half the difference between
 * the h1's line box and its own box. Both terms are tokens, so changing the
 * display type or the control scale keeps this aligned rather than needing a
 * fresh magic number, and the smaller box also stops the hover fill from
 * out-weighing the title it sits next to. The h1 is `white-space: nowrap`, so
 * there is only ever one line box to centre on.
 */
.sl-publish-back {
  flex: 0 0 auto;
  width: var(--sl-control-sm);
  height: var(--sl-control-sm);
  margin-top: calc(
    (var(--sl-font-size-display) * var(--sl-line-height-tight) - var(--sl-control-sm)) / 2
  );
}

/*
 * The header's own `justify-content: space-between` would push the title away
 * from the back control, to opposite ends of the row. On this screen the two
 * are one unit, so the row packs from the start instead.
 */
.sl-publish-screen .sl-page-header {
  justify-content: flex-start;
  gap: var(--sl-space-6);
}

/*
 * The command a developer copies whole.
 *
 * This used to scroll horizontally on one line, to avoid wrapping mid-flag.
 * As a section at the bottom of the Library list that was the lesser evil; on
 * its own screen it was the worse one. The visible slice was the start of the
 * key, so the reader met a truncated secret with no verb attached, and the
 * `npx spec-layer pull` half that says what the thing DOES sat off-screen
 * behind a scrollbar that is easy to miss in a 480px panel.
 *
 * So it wraps instead, and the whole command is visible at once. Wrapping
 * inserts no characters, so selecting it by hand still copies a runnable
 * command, and the Copy setup command button below is the path that matters.
 */
.sl-publish-command {
  min-width: 0;
  margin-top: var(--sl-space-10);
  padding: var(--sl-space-8) var(--sl-space-10);
  background: var(--sl-color-surface-subdued);
  border: 1px solid var(--sl-color-border-muted);
  border-radius: var(--sl-radius-md);
}

.sl-publish-command > code {
  display: block;
  color: var(--sl-color-text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  /*
   * Defensive, not a fix for anything observed here: SF Mono, which
   * `ui-monospace` resolves to on macOS, leaves `--` as two hyphens (measured).
   * But `ui-monospace` is whatever the user's OS calls a monospace font, and
   * several popular ones (Fira Code, JetBrains Mono, Iosevka) ligate `--` into
   * a single long dash. This command carries a `--id` flag, so on one of those
   * a developer would read an em dash where two hyphens belong and typing back
   * what they read would fail. The characters are always right; this keeps the
   * glyphs from saying otherwise.
   */
  font-variant-ligatures: none;
}

.sl-publish-command-actions {
  min-width: 0;
  display: flex;
  /* Three buttons at the panel's 480px do not always fit on one line. */
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sl-space-6);
  margin-top: var(--sl-space-8);
}

.sl-publish-hint {
  margin: var(--sl-space-4) 0 0;
  color: var(--sl-color-text-quiet);
  font-size: var(--sl-font-size-caption);
}

/*
 * Reports whichever action ran last, so it follows both groups. It needs the
 * same air between it and the group above as the groups have between them;
 * at a tighter margin it read as a second line of the rotate consequence,
 * being another small grey sentence directly beneath one.
 */
.sl-publish-status {
  margin: var(--sl-space-16) 0 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
}

.sl-publish-status.is-error {
  color: var(--sl-color-danger);
}

.sl-global-search-layer {
  position: absolute;
  z-index: 40;
  inset: 0;
}

.sl-global-search-scrim {
  position: absolute;
  inset: 0;
  padding: 0;
  background: var(--sl-color-overlay);
  border: 0;
  backdrop-filter: blur(1.5px);
}

.sl-global-search-panel {
  position: absolute;
  top: 56px;
  left: 12px;
  right: 12px;
  max-height: calc(100% - 76px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border-strong);
  border-radius: var(--sl-radius-lg);
  box-shadow: var(--sl-shadow-overlay);
  animation: sl-search-dialog-in var(--sl-motion-standard) var(--sl-ease-out) both;
}

.sl-global-search-input {
  min-height: 46px;
  flex: none;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-8) 0 var(--sl-space-12);
  color: var(--sl-color-text-muted);
  border-bottom: 1px solid var(--sl-color-border);
}

.sl-global-search-input > svg {
  color: var(--sl-color-text-muted);
}

.sl-global-search-input > input {
  min-width: 0;
  height: 44px;
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  outline: 0;
  font-size: var(--sl-font-size-body);
}

.sl-global-search-input > input::placeholder {
  color: var(--sl-color-text-quiet);
}

.sl-global-search-input > input::-webkit-search-cancel-button {
  display: none;
}

.sl-global-search-clear,
.sl-global-search-close {
  height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-md);
  cursor: pointer;
}

.sl-global-search-clear {
  padding-inline: var(--sl-space-8);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-global-search-close {
  width: 28px;
}

.sl-global-search-clear:hover,
.sl-global-search-close:hover {
  color: var(--sl-color-text);
  background: var(--sl-color-surface-hover);
}

.sl-global-search-results {
  min-height: 0;
  overflow: auto;
  padding: var(--sl-space-8);
  scrollbar-width: thin;
  scrollbar-color: var(--sl-color-border-strong) transparent;
}

.sl-global-search-results section + section {
  margin-top: var(--sl-space-6);
  padding-top: var(--sl-space-8);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-global-search-results h2 {
  margin: 0;
  padding: var(--sl-space-4) var(--sl-space-8) var(--sl-space-6);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-micro);
  font-weight: var(--sl-font-weight-semibold);
  letter-spacing: var(--sl-tracking-caps-wide);
  text-transform: uppercase;
}

.sl-global-search-result {
  width: 100%;
  min-height: 41px;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 16px;
  align-items: center;
  gap: var(--sl-space-8);
  padding: var(--sl-space-4) var(--sl-space-8);
  color: var(--sl-color-text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--sl-radius-md);
  text-align: left;
  cursor: pointer;
  transition:
    color var(--sl-motion-fast) var(--sl-ease-standard),
    background var(--sl-motion-fast) var(--sl-ease-standard),
    border-color var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-global-search-result:hover,
.sl-global-search-result.is-active,
.sl-global-search-result:focus-visible {
  background: var(--sl-color-surface-selected);
  border-color: var(--sl-color-accent-border);
}

.sl-global-search-result:focus-visible {
  outline: 2px solid var(--sl-color-accent);
  outline-offset: -2px;
}

.sl-global-search-result > span:nth-child(2),
.sl-global-search-result strong,
.sl-global-search-result small {
  min-width: 0;
  display: block;
}

.sl-global-search-result strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-global-search-result small {
  /* Optical: drops the icon onto the first text baseline. Not rhythm. */
  margin-top: 1px;
  overflow: hidden;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sl-global-search-result > svg {
  color: var(--sl-color-text-quiet);
  opacity: 0;
  transform: translateX(-2px);
  transition:
    opacity var(--sl-motion-fast) var(--sl-ease-standard),
    transform var(--sl-motion-fast) var(--sl-ease-standard);
}

.sl-global-search-result:hover > svg,
.sl-global-search-result.is-active > svg,
.sl-global-search-result:focus-visible > svg {
  color: var(--sl-color-accent);
  opacity: 1;
  transform: translateX(0);
}

.sl-global-search-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--sl-color-accent);
  background: var(--sl-color-accent-soft);
  border-radius: var(--sl-radius-md);
}

.sl-global-search-icon.is-source {
  color: var(--sl-color-success);
  background: var(--sl-color-success-soft);
}

.sl-global-search-empty {
  min-height: 188px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--sl-color-text-quiet);
}

.sl-global-search-empty strong {
  max-width: 300px;
  margin-top: var(--sl-space-10);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  text-align: center;
}

.sl-global-search-empty small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
}

.sl-global-search-empty button {
  min-height: 28px;
  margin-top: var(--sl-space-12);
  padding: 0 var(--sl-space-10);
  color: var(--sl-color-text);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
  cursor: pointer;
}

.sl-global-search-loading {
  min-height: 41px;
  display: flex;
  align-items: center;
  gap: var(--sl-space-8);
  padding: var(--sl-space-4) var(--sl-space-12);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
}

.sl-global-search-loading > svg {
  color: var(--sl-color-accent);
  animation: sl-spin 800ms linear infinite;
}

.sl-global-search-footer {
  min-height: 32px;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sl-space-14);
  padding: 0 var(--sl-space-12);
  color: var(--sl-color-text-quiet);
  background: var(--sl-color-chrome);
  border-top: 1px solid var(--sl-color-border-muted);
  font-size: var(--sl-font-size-micro);
}

.sl-global-search-footer > span {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-4);
  white-space: nowrap;
}

.sl-global-search-footer kbd {
  min-width: 16px;
  height: 16px;
  display: inline-grid;
  place-items: center;
  padding: 0 var(--sl-space-4);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-sm);
  font-family: inherit;
  font-size: var(--sl-font-size-micro);
}

.sl-global-search-empty button:hover {
  background: var(--sl-color-surface-hover);
}

@keyframes sl-search-dialog-in {
  from {
    opacity: 0;
    transform: translateY(-6px) scale(0.99);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.sl-foundation-toolbar {
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sl-space-12);
  padding: 0 var(--sl-space-14);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface-subdued);
  border-top: 1px solid var(--sl-color-border-muted);
  border-bottom: 1px solid var(--sl-color-border-muted);
  font-size: var(--sl-font-size-support);
}

.sl-foundation-screen .sl-page-header {
  min-height: 48px;
  padding-bottom: var(--sl-space-6);
}

.sl-foundation-toolbar > span {
  color: var(--sl-color-text-muted);
  font-weight: var(--sl-font-weight-medium);
}

.sl-foundation-bulk {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-8);
  padding: 0 var(--sl-space-8) 0 var(--sl-space-6);
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-medium);
  cursor: pointer;
}

.sl-foundation-bulk:hover {
  background: var(--sl-color-surface-hover);
}

.sl-foundation-bulk .sl-checkbox-box[data-checked="true"],
.sl-foundation-bulk .sl-checkbox-box[data-mixed="true"],
.sl-foundation-summary .sl-checkbox-box[data-checked="true"] {
  background: var(--sl-color-accent);
  border-color: var(--sl-color-accent);
}

.sl-foundation-bulk .sl-checkbox-box[data-checked="false"]:not([data-mixed="true"]) > svg,
.sl-foundation-summary .sl-checkbox-box[data-checked="false"] > svg {
  visibility: hidden;
}

.sl-foundation-list {
  /* Clears the sticky footer; tracks --sl-footer-height, not the scale.
     No left/right padding here — rows run edge-to-edge and carry their own
     inset, so the hover/border spans the full row width instead of reading
     as an inset card. */
  padding-bottom: 68px;
}

.sl-foundation-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  border-bottom: 1px solid var(--sl-color-border-muted);
}

.sl-foundation-row:hover {
  background: var(--sl-color-surface-subdued);
}

.sl-foundation-copy {
  margin-inline-end: var(--sl-space-8);
  color: var(--sl-color-text-muted);
}

.sl-foundation-summary {
  width: 100%;
  /* Matches .sl-library-summary's height, icon column, and gap: two
     near-identical row patterns (checkbox/icon + title/metadata) should read
     as one system rather than as two independently tuned rows. */
  min-height: 49px;
  display: grid;
  grid-template-columns: 18px 22px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-4);
  /* Horizontal inset lives on the row itself (matches .sl-foundation-toolbar's
     14px). The hover fill lives on .sl-foundation-row, one level up, so it
     spans both grid columns (summary and copy button) instead of stopping
     at this element's own column. */
  padding: var(--sl-space-6) var(--sl-space-14);
  color: inherit;
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.sl-foundation-source-icon {
  display: grid;
  place-items: center;
  color: var(--sl-color-source-icon);
}

.sl-foundation-title {
  min-width: 0;
}

.sl-foundation-title > strong,
.sl-foundation-title > small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
