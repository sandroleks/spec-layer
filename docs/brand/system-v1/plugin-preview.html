.sl-foundation-title > strong {
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-foundation-title > small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
}

.sl-foundation-status {
  margin: var(--sl-space-8) var(--sl-space-14) 0;
}

.sl-foundation-status .sl-banner[data-tone="success"] {
  color: var(--sl-color-text);
}

.sl-foundation-status:empty {
  display: none;
}

.sl-foundation-screen .sl-screen-scroll {
  padding: 0;
  overflow-x: hidden;
}

/* --------------------------------------------------------------------------
 * Settings — generated frame appearance
 * ----------------------------------------------------------------------- */

/* Symmetric gutters. The right side used to be 14 against a 16 left, so every
   card on Settings and License sat 2px off-center from its own page header. */
.sl-settings-screen .sl-screen-scroll {
  padding: 0 var(--sl-space-16) var(--sl-space-20);
}

.sl-settings-screen .sl-page-header {
  padding-left: var(--sl-space-16);
}

.sl-settings-section {
  min-width: 0;
}

.sl-frame-theme-section {
  padding-top: var(--sl-space-14);
}

.sl-settings-section-heading {
  margin-bottom: var(--sl-space-10);
}

.sl-settings-section-heading h2 {
  margin: 0 0 var(--sl-space-4);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-settings-section-heading p,
.sl-logo-setting p {
  margin: 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
}

.sl-theme-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: var(--sl-space-6);
}

.sl-theme-choice {
  min-width: 0;
  position: relative;
  padding: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface-subdued);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-micro);
  line-height: var(--sl-line-height-tight);
  cursor: pointer;
}

.sl-theme-choice:hover {
  border-color: var(--sl-color-border-strong);
}

.sl-theme-choice.is-selected {
  color: var(--sl-color-text);
  border-color: var(--sl-color-accent);
  box-shadow: inset 0 0 0 1px var(--sl-color-accent);
}

.sl-theme-choice-check {
  width: 12px;
  height: 12px;
  position: absolute;
  right: 3px;
  top: 3px;
  display: grid;
  place-items: center;
  color: var(--sl-color-text-on-accent);
  background: var(--sl-color-accent);
  border-radius: 50%;
}

.sl-theme-preview {
  height: 29px;
  display: grid;
  place-items: center;
  margin-bottom: var(--sl-space-4);
  border-radius: var(--sl-radius-sm);
  font-size: var(--sl-font-size-body);
  font-weight: var(--sl-font-weight-bold);
}

/* Preset swatch colours are set inline from THEME_PRESETS in screens/settings.ts
   so the preview cannot drift from the frame it previews. Only the type
   treatment lives here: it stands in for the preset's heading font, which the
   plugin iframe does not load. */
.sl-theme-preview.editorial {
  font-family: Georgia, serif;
}

.sl-theme-preview.custom {
  color: var(--sl-color-text-muted);
  background: var(--sl-color-surface-hover);
}

.sl-custom-theme-controls {
  margin-top: var(--sl-space-16);
  padding-top: var(--sl-space-12);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-custom-theme-controls h3,
.sl-logo-setting h3 {
  margin: 0 0 var(--sl-space-8);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-bold);
  letter-spacing: var(--sl-tracking-caps-wide);
  text-transform: uppercase;
}

.sl-theme-color-grid,
.sl-theme-font-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sl-space-8) var(--sl-space-8);
}

.sl-theme-font-grid {
  margin-top: var(--sl-space-10);
}

.sl-theme-color-field,
.sl-theme-font-grid label {
  min-width: 0;
}

.sl-theme-color-field > span:first-child,
.sl-theme-font-grid label > span:first-child {
  display: block;
  margin-bottom: var(--sl-space-6);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-tight);
}

.sl-theme-color-input {
  height: 31px;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-8) 0 var(--sl-space-4);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

/*
 * The swatch is a native <input type="color">, stripped back to the inert <i>
 * it replaces so the field looks unchanged and only its behaviour is new. The
 * two selectors below are the only way to reach the rendered swatch, and the
 * generic `.sl-theme-color-input input` rule further down would otherwise
 * stretch this to the full field width (this one is more specific, so it wins
 * regardless of order).
 */
.sl-theme-color-input input[type="color"] {
  /* Explicit placement: the hex field is first in the DOM so it stays the
     label's control (see colorField), so the columns cannot be left to
     source order. */
  grid-column: 1;
  grid-row: 1;
  width: 22px;
  height: 22px;
  display: block;
  padding: 0;
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--sl-color-text) 16%, transparent);
  border-radius: var(--sl-radius-sm);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.sl-theme-color-input input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.sl-theme-color-input input[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: var(--sl-radius-sm);
}

.sl-theme-color-input > input[data-theme-field] {
  grid-column: 2;
  grid-row: 1;
}

.sl-theme-color-input input,
.sl-theme-font-grid input {
  width: 100%;
  min-width: 0;
  height: 29px;
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: var(--sl-font-size-caption);
}

.sl-theme-font-grid input {
  padding: 0 var(--sl-space-8);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-theme-color-input:focus-within,
.sl-theme-font-grid input:focus-visible {
  border-color: var(--sl-color-accent);
  box-shadow: 0 0 0 1px var(--sl-color-accent);
}

/* --------------------------------------------------------------------------
 * Font picker — a combobox, not a plain text field
 *
 * The vNext Settings migration shipped these two fields as bare inputs, so the
 * only way to set a font was to type a family name exactly and hope; the host's
 * font list was fetched and then used for nothing but a warning after the fact.
 * The list is an overlay in the shell root (see fontMenuMarkup) because this
 * panel scrolls and would clip a child, so everything here is either the field
 * or the fixed layer.
 * ----------------------------------------------------------------------- */

.sl-font-input {
  position: relative;
  display: block;
}

.sl-theme-font-grid .sl-font-input input {
  /* Room for the chevron, so a long family name never runs under it. */
  padding-right: var(--sl-space-20);
}

.sl-font-toggle {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--sl-space-20);
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--sl-color-text-muted);
  background: transparent;
  border: 0;
  cursor: pointer;
}

.sl-font-toggle:hover {
  color: var(--sl-color-text);
}

.sl-font-menu {
  /* Fixed, and placed by computeMenuPlacement in viewport coordinates: it has
     to escape the scrolling panel and flip above the input near the bottom
     edge. `top`/`bottom`/`left`/`width`/`max-height` are all set inline.
     Above the sticky footer (z 10) and the row menus (20), below the global
     search palette (40), which is modal and closes this on the way in. */
  position: fixed;
  z-index: 30;
  overflow-y: auto;
  padding: var(--sl-space-4);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
  box-shadow: var(--sl-shadow-menu);
  scrollbar-width: thin;
  scrollbar-color: var(--sl-color-border-strong) transparent;
}

.sl-font-option {
  min-height: 26px;
  display: flex;
  align-items: center;
  padding: 0 var(--sl-space-8);
  border-radius: var(--sl-radius-sm);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.sl-font-option:hover,
.sl-font-option.is-active {
  background: var(--sl-color-surface-hover);
}

.sl-font-option.is-default {
  color: var(--sl-color-text-muted);
}

.sl-font-menu-note {
  margin: 0;
  padding: var(--sl-space-6) var(--sl-space-8);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-logo-setting {
  margin-top: var(--sl-space-16);
  padding-top: var(--sl-space-14);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-logo-setting h3 {
  margin-bottom: var(--sl-space-6);
}

.sl-logo-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sl-space-8);
  margin-top: var(--sl-space-8);
}

.sl-logo-actions .sl-button {
  height: 32px;
  min-height: 32px;
  padding: 0 var(--sl-space-10);
  font-size: var(--sl-font-size-control);
}

.sl-logo-actions .sl-button[data-tone="secondary"] {
  background: var(--sl-color-surface);
}

.sl-logo-status {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-4);
  color: var(--sl-color-success);
  font-size: var(--sl-font-size-caption);
}

.sl-settings-hint {
  margin: var(--sl-space-8) 0 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-settings-hint:empty {
  display: none;
}

.sl-settings-hint[data-tone="danger"] {
  color: var(--sl-color-danger);
}

.sl-settings-hint[data-tone="warning"] {
  color: var(--sl-color-warning);
}

/* --------------------------------------------------------------------------
 * License — plan, quota, activation, and device connection
 * ----------------------------------------------------------------------- */

/*
 * Title-only header, so it uses the 48px bar the other single-line screens use
 * (.sl-library-screen, .sl-foundation-screen). Left on the 67px base — which is
 * sized for Settings' title *and* subtitle — the min-height had 26px of dead
 * space under the h1, putting 38px between the title and the plan card while
 * every gap below the card is 12-16. Matching those two screens puts the title
 * 15px above the first block, same as Foundations.
 */
.sl-license-screen .sl-page-header {
  min-height: 48px;
  padding-bottom: var(--sl-space-6);
}

.sl-license-screen .sl-screen-scroll {
  padding-bottom: var(--sl-space-16);
}

.sl-license-plan-card {
  padding: var(--sl-space-12);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: 9px;
}

.sl-license-plan-card.is-pro {
  background: var(--sl-color-accent-soft);
  border-color: var(--sl-color-accent-border);
}

.sl-license-plan-heading {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sl-space-8);
}

.sl-license-plan-heading > span:nth-child(2) {
  min-width: 0;
}

.sl-license-plan-heading strong,
.sl-license-plan-heading small {
  display: block;
}

.sl-license-plan-heading strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-semibold);
}

/*
 * Wraps rather than truncates. This line is the whole description of the plan
 * now that Pro's benefits list is gone, so an ellipsis here would hide the only
 * statement of what the plan does. The heading is centered, so a second line
 * costs the card nothing.
 */
.sl-license-plan-heading small {
  margin-top: var(--sl-space-2);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
}

.sl-plan-icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--sl-color-accent);
  background: var(--sl-color-accent-soft);
  border-radius: var(--sl-radius-md);
}

.sl-license-plan-badge {
  height: 22px;
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-4);
  padding: 0 var(--sl-space-8);
  color: var(--sl-color-success);
  background: var(--sl-color-success-soft);
  border: 1px solid color-mix(in srgb, var(--sl-color-success) 22%, transparent);
  border-radius: var(--sl-radius-pill);
  font-size: var(--sl-font-size-caption);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-license-usage {
  margin-top: var(--sl-space-10);
  padding-top: var(--sl-space-10);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-license-usage-copy {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sl-space-12);
  margin-bottom: var(--sl-space-8);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-tight);
}

.sl-license-usage-copy > span:first-child strong,
.sl-license-usage-copy > span:first-child small {
  display: block;
}

.sl-license-usage-copy > span:first-child strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-license-usage-copy > span:first-child small {
  margin-top: var(--sl-space-2);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-tight);
}

.sl-license-usage-track {
  height: 5px;
  display: block;
  overflow: hidden;
  background: var(--sl-color-surface-hover);
  border-radius: var(--sl-radius-pill);
}

.sl-license-usage-track i {
  height: 100%;
  display: block;
  background: var(--sl-color-accent);
  border-radius: inherit;
}

/* Mirrors the header ring's [data-state="low"|"exhausted"] tint, so the same
   quota reads the same way in both places. */
.sl-license-usage-track[data-tone="low"] i,
.sl-license-usage-track[data-tone="exhausted"] i {
  background: var(--sl-color-warning-graphic);
}

.sl-license-unknown-note {
  display: flex;
  align-items: center;
  gap: var(--sl-space-6);
  margin-top: var(--sl-space-12);
  padding-top: var(--sl-space-10);
  color: var(--sl-color-text-muted);
  border-top: 1px solid var(--sl-color-border-muted);
  font-size: var(--sl-font-size-caption);
}

.sl-license-unknown-note svg {
  flex: 0 0 auto;
  color: var(--sl-color-accent);
}

.sl-license-plan-actions {
  margin-top: var(--sl-space-12);
}

.sl-license-plan-actions .sl-button,
.sl-connected-license-actions .sl-button,
.sl-license-support-actions .sl-button {
  height: 31px;
  min-height: 31px;
  padding: 0 var(--sl-space-10);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
}

.sl-license-screen .sl-button[data-tone="quiet"] {
  background: var(--sl-color-surface);
  border-color: var(--sl-color-border);
}

.sl-license-account,
.sl-license-activation-section {
  margin-top: var(--sl-space-16);
  padding-top: var(--sl-space-14);
  border-top: 1px solid var(--sl-color-border-muted);
}

.sl-license-account > .sl-license-activation-section {
  margin: 0;
  padding: 0;
  border: 0;
}

.sl-license-account .sl-settings-section-heading {
  margin-bottom: var(--sl-space-10);
}

.sl-license-account .sl-settings-section-heading h2 {
  margin: 0 0 var(--sl-space-4);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
}

.sl-license-account .sl-settings-section-heading p {
  margin: 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-license-status-message {
  display: grid;
  grid-template-columns: 17px minmax(0, 1fr);
  align-items: start;
  gap: var(--sl-space-8);
  margin-bottom: var(--sl-space-10);
  padding: var(--sl-space-8) var(--sl-space-10);
  background: var(--sl-color-surface-subdued);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-license-status-message > svg {
  /* Optical: drops the icon onto the first text baseline. Not rhythm. */
  margin-top: 1px;
}

.sl-license-status-message strong,
.sl-license-status-message small {
  display: block;
}

.sl-license-status-message strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  line-height: var(--sl-line-height-body);
}

.sl-license-status-message small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  line-height: var(--sl-line-height-body);
}

.sl-license-status-message.is-warning {
  background: var(--sl-color-warning-soft);
  border-color: var(--sl-color-warning-border);
}

.sl-license-status-message.is-warning > svg {
  color: var(--sl-color-warning);
}

.sl-license-status-message.is-danger {
  background: var(--sl-color-danger-soft);
  border-color: var(--sl-color-danger-border);
}

.sl-license-status-message.is-danger > svg {
  color: var(--sl-color-danger);
}

.sl-license-status-message.is-neutral > svg {
  color: var(--sl-color-accent);
}

.sl-license-status-message.is-success {
  background: var(--sl-color-success-soft);
  border-color: var(--sl-color-success-border);
}

.sl-license-status-message.is-success > svg {
  color: var(--sl-color-success);
}

.sl-license-activation-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--sl-space-8);
}

.sl-license-field {
  height: 34px;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-6);
  padding: 0 var(--sl-space-8);
  color: var(--sl-color-text-quiet);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-license-field:focus-within {
  border-color: var(--sl-color-accent);
  box-shadow: 0 0 0 1px var(--sl-color-accent);
}

.sl-license-field input {
  width: 100%;
  min-width: 0;
  height: 100%;
  padding: 0;
  color: var(--sl-color-text);
  background: transparent;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: var(--sl-font-size-support);
}

.sl-license-field input::placeholder {
  color: var(--sl-color-text-disabled);
}

.sl-license-field input:disabled {
  opacity: 0.6;
}

.sl-license-activation-form .sl-button {
  min-width: 78px;
  height: 34px;
  min-height: 34px;
  padding: 0 var(--sl-space-10);
  border-radius: var(--sl-radius-md);
  font-size: var(--sl-font-size-control);
}

.sl-license-spinner,
.sl-connected-license-status.is-removing svg,
.sl-license-activation-form button:disabled svg {
  animation: sl-license-spin 0.8s linear infinite;
}

@keyframes sl-license-spin {
  to {
    transform: rotate(360deg);
  }
}

.sl-connected-license {
  min-height: 50px;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sl-space-8);
  padding: var(--sl-space-8) var(--sl-space-8);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-connected-license-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--sl-color-accent);
  background: var(--sl-color-accent-soft);
  border-radius: var(--sl-radius-md);
}

.sl-connected-license strong,
.sl-connected-license small {
  display: block;
}

.sl-connected-license strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-support);
  letter-spacing: var(--sl-tracking-caps);
}

.sl-connected-license small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
}

.sl-connected-license-status {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-4);
  color: var(--sl-color-success);
  font-size: var(--sl-font-size-caption);
}

.sl-connected-license-actions,
.sl-license-support-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sl-space-6);
  margin-top: var(--sl-space-8);
}

.sl-button.is-danger {
  color: var(--sl-color-danger);
}

.sl-saved-license-row {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sl-space-8);
  padding: var(--sl-space-6) var(--sl-space-8) var(--sl-space-6) var(--sl-space-10);
  background: var(--sl-color-surface);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-md);
}

.sl-saved-license-row > span {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-8);
  color: var(--sl-color-text-quiet);
}

.sl-saved-license-row strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-caption);
  letter-spacing: var(--sl-tracking-caps);
}

.sl-plan-card {
  padding: var(--sl-space-14);
}

.sl-plan-heading {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sl-space-10);
}

.sl-plan-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.sl-plan-copy > strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-section);
  font-weight: var(--sl-font-weight-semibold);
  line-height: var(--sl-line-height-tight);
}

.sl-plan-copy > small {
  margin-top: var(--sl-space-4);
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-control);
}

.sl-plan-usage {
  margin-top: var(--sl-space-12);
  padding-top: var(--sl-space-12);
  border-top: 1px solid var(--sl-color-border);
}

.sl-progress-track {
  height: 5px;
  display: block;
  overflow: hidden;
  background: var(--sl-color-surface);
  border-radius: var(--sl-radius-pill);
}

.sl-progress-track > i {
  height: 100%;
  display: block;
  background: var(--sl-color-accent);
  border-radius: inherit;
  transition: width var(--sl-motion-slow) var(--sl-ease-out);
}

.sl-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: var(--sl-space-16);
  background: var(--sl-color-overlay);
}

.sl-dialog {
  width: min(360px, 100%);
  max-height: min(560px, calc(100vh - 32px));
  overflow: auto;
  padding: var(--sl-space-14);
  background: var(--sl-color-surface-raised);
  border: 1px solid var(--sl-color-border);
  border-radius: var(--sl-radius-lg);
  box-shadow: var(--sl-shadow-overlay);
}

.sl-confirm-dialog > h2 {
  margin: 0 0 var(--sl-space-8);
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-section);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-confirm-dialog > p {
  margin: 0;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-control);
  line-height: var(--sl-line-height-body);
}

.sl-dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--sl-space-8);
  margin-top: var(--sl-space-14);
}

/*
 * The header is a flex row, so the grid-template-columns this block used to
 * declare on it never applied. What actually needs to give under 440px is the
 * allowance: drop the label and the Upgrade action, because the ring and the
 * count together still say what is left.
 */
@media (max-width: 439px) {
  .sl-utility-header {
    gap: var(--sl-space-6);
    padding-inline: var(--sl-space-6);
  }

  .sl-allowance-copy > strong,
  .sl-allowance-action {
    display: none;
  }

  /* The count is the whole message now, so it must not open with a separator. */
  .sl-allowance-copy > small::before {
    content: none;
  }
}


/* Centered state for a screen that has nothing to act on yet. */
.sl-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sl-space-8);
  min-height: 320px;
  padding: var(--sl-space-32) var(--sl-space-16);
  text-align: center;
}

.sl-empty-state > strong {
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-section);
  font-weight: var(--sl-font-weight-semibold);
}

.sl-empty-state > p {
  margin: 0;
  max-width: 34ch;
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-control);
  line-height: var(--sl-line-height-body);
}

/* Where a screen puts its build result. Collapses to nothing when empty, so it
   costs no space until there is something to say. */
.sl-screen-status:empty {
  display: none;
}

.sl-screen-status {
  margin: var(--sl-space-12) 0 var(--sl-space-8);
}

/* Work in progress — adapted from the original plugin's sparkle loader. */
.sl-work-status {
  min-width: 0;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-8);
  padding: var(--sl-space-8) var(--sl-space-10);
  color: var(--sl-color-text);
  background: var(--sl-color-surface-subdued);
  border: 1px solid var(--sl-color-border-muted);
  border-radius: var(--sl-radius-md);
}

.sl-work-spark {
  width: 13px;
  height: 13px;
  background: var(--sl-color-accent);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
  animation: sl-work-spark 1.4s ease-in-out infinite;
}

.sl-work-copy,
.sl-work-line {
  min-width: 0;
}

.sl-work-copy {
  display: grid;
  gap: var(--sl-space-6);
}

.sl-work-line {
  display: flex;
  align-items: center;
  gap: var(--sl-space-4);
}

.sl-work-line > strong {
  overflow: hidden;
  color: var(--sl-color-text);
  font-size: var(--sl-font-size-control);
  font-weight: var(--sl-font-weight-medium);
  line-height: var(--sl-line-height-control);
  text-overflow: ellipsis;
  white-space: nowrap;
}

@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .sl-work-line > strong {
    color: var(--sl-color-text);
    background: linear-gradient(
      90deg,
      var(--sl-color-text-muted) 0%,
      var(--sl-color-text) 25%,
      var(--sl-color-text-muted) 50%
    );
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sl-work-shimmer 2.6s linear infinite;
  }
}

.sl-work-dots {
  display: inline-flex;
  align-items: center;
  gap: var(--sl-space-2);
}

.sl-work-dots > i {
  width: 3px;
  height: 3px;
  background: var(--sl-color-text-muted);
  border-radius: 50%;
  animation: sl-work-dot 1.4s ease-in-out infinite;
}

.sl-work-dots > i:nth-child(2) {
  animation-delay: 0.18s;
}

.sl-work-dots > i:nth-child(3) {
  animation-delay: 0.36s;
}

.sl-work-progress {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sl-space-8);
}

.sl-work-progress .sl-progress-track {
  height: 4px;
  background: var(--sl-color-surface);
}

.sl-work-count {
  color: var(--sl-color-text-muted);
  font-size: var(--sl-font-size-caption);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.sl-loading-rows {
  display: grid;
  padding: 0 var(--sl-space-14);
}

.sl-loading-row {
  min-height: 54px;
  display: grid;
  grid-template-columns: 21px minmax(0, 1fr);
  align-items: center;
  gap: var(--sl-space-8);
  border-bottom: 1px solid var(--sl-color-border-muted);
}

.sl-loading-row > span {
  min-width: 0;
  display: grid;
  gap: var(--sl-space-6);
}

.sl-loading-icon {
  width: 18px;
  height: 18px;
  border-radius: var(--sl-radius-sm);
}

.sl-loading-title {
  height: 8px;
}

.sl-loading-meta {
  height: 6px;
  opacity: 0.72;
}

@keyframes sl-work-spark {
  0%,
  100% {
    opacity: 0.65;
    transform: rotate(0deg) scale(0.8);
  }
  50% {
    opacity: 1;
    transform: rotate(90deg) scale(1.1);
  }
}

@keyframes sl-work-shimmer {
  to {
    background-position: -220% 0;
  }
}

@keyframes sl-work-dot {
  0%,
  70%,
  100% {
    opacity: 0.25;
    transform: translateY(0);
  }
  35% {
    opacity: 1;
    transform: translateY(-1px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .sl-work-spark,
  .sl-work-dots > i,
  .sl-work-line > strong {
    animation: none;
  }

  .sl-work-line > strong {
    color: var(--sl-color-text);
    -webkit-text-fill-color: var(--sl-color-text);
  }
}
