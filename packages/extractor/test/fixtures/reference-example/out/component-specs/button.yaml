  source: { provider: figma, file_name: Reference Design System }
source: { node_id: 20:100, node_name: Button, component_key: ref-button }
component:
  name: Button
  description: Triggers an action in place. Pick the visual weight with Style and the footprint with Size.
  related: [Icon]
api:
  variants:
    Size: { options: [Medium, Large], default: Medium }
    Style: { options: [Filled, Outlined], default: Filled }
  states: [hover, disabled]
  booleans: { Show icon: { default: true } }
  slots: { Label: { type: text, default: Button } }
anatomy:
  - part: icon-slot
    path: Container/icon-slot
    type: FRAME
    children:
      - part: icon
        path: Container/icon-slot/icon
        type: INSTANCE
        component: Icon
  - { part: label, path: Container/label, type: TEXT }
layout:
  scope: default_variant
  items:
    - path: Container
      summary: horizontal, padding 8/12/8/12, gap 8, radius 8
      values: { radius: 8, gap: 8 }
    - { path: Container/icon-slot, summary: "horizontal, padding 2/2/2/2" }
