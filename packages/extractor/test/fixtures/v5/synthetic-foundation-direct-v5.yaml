    severity: error
    entity_id: VariableID:cycle-a
    mode_id: ModeID:p-light
    message: "Alias resolution cycles back to itself: VariableID:cycle-a -> VariableID:cycle-b -> VariableID:cycle-a."
    details:
      chain:
        - { token_id: VariableID:cycle-a, mode_id: ModeID:p-light }
        - { token_id: VariableID:cycle-b, mode_id: ModeID:p-light }
        - { token_id: VariableID:cycle-a, mode_id: ModeID:p-light }
