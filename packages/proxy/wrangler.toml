name = "spec-layer-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-01"
account_id = "f3ea0f8b485b5b11e917f415c224b1cb"
workers_dev = false

routes = [{ pattern = "api.spec-layer.com", custom_domain = true }]

kv_namespaces = [
  { binding = "LICENSE_CACHE", id = "46fbd911b2194babbf2019fd4d0b412a" }
]

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

# Workers Rate Limiting: counters shared by every isolate in a Cloudflare
# location, behind the per-isolate windows in src/ratelimit.ts. The limits
# match those windows (60 and 20 a minute per key). A namespace_id is a
# number chosen per account; it only has to differ from this account's other
# rate limiters. Bindings do not inherit, so [env.staging] declares its own.
[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LICENSE_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Usage metrics: one data point per request (src/metrics.ts), queried with
# SQL from the dashboard or the API; retention is three months. Bindings do
# not inherit, so [env.staging] declares its own dataset and the two never
# mix. The name carries the layout version: a column that changes meaning
# takes a new name rather than reinterpreting the rows already written.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "spec_layer_requests_v1"

# The plugin's usage events (src/events.ts), one point each, in a dataset of
# their own: a request and an event are different rows with different
# columns, and the two must never share a table.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "spec_layer_events_v1"

# Every invocation's logs reach the Workers dashboard. The log volume is a
# few JSON lines per request, so sampling would only hide the rare
# `upstream_error` or `fair_use_flag` this is for.
[observability]
enabled = true
head_sampling_rate = 1

# Staging: the same Worker under its own name (spec-layer-proxy-staging),
# with its own KV namespace, Durable Object storage and secrets, so a deploy
# is proven on real Cloudflare bindings before production sees it. Bindings
# and routes do not inherit from the top level; migrations do.
#
# Like production it has no workers.dev origin: a custom domain in the same
# zone keeps it behind the zone's WAF rate rules, so staging's own Anthropic
# key is not an unthrottled side door.
#
# The KV namespace is "staging-LICENSE_CACHE", created with
#   npx wrangler kv namespace create LICENSE_CACHE --env staging
# deploy-proxy.yml refuses to deploy staging if this id goes missing.
[env.staging]
workers_dev = false
routes = [{ pattern = "staging-api.spec-layer.com", custom_domain = true }]
kv_namespaces = [
  { binding = "LICENSE_CACHE", id = "b3c8939304774469a89e943d98022de9" }
]

[[env.staging.durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaDO"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[[env.staging.ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "LICENSE_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 20, period = 60 }

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "spec_layer_requests_v1_staging"

[[env.staging.analytics_engine_datasets]]
binding = "EVENTS"
dataset = "spec_layer_events_v1_staging"
