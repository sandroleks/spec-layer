name = "spec-layer-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-01"
account_id = "f3ea0f8b485b5b11e917f415c224b1cb"
workers_dev = false

routes = [{ pattern = "api.spec-layer.com", custom_domain = true }]

kv_namespaces = [
  { binding = "LICENSE_CACHE", id = "46fbd911b2194babbf2019fd4d0b412a" }
]

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

# Every invocation's logs reach the Workers dashboard. The log volume is a
# few JSON lines per request, so sampling would only hide the rare
# `upstream_error` or `fair_use_flag` this is for.
[observability]
enabled = true
head_sampling_rate = 1

# Staging: the same Worker under its own name (spec-layer-proxy-staging),
# with its own KV namespace, Durable Object storage and secrets, so a deploy
# is proven on real Cloudflare bindings before production sees it. Bindings
# and routes do not inherit from the top level; migrations do.
#
# Like production it has no workers.dev origin: a custom domain in the same
# zone keeps it behind the zone's WAF rate rules, so staging's own Anthropic
# key is not an unthrottled side door.
#
# The KV id is deliberately absent until the namespace exists:
#   npx wrangler kv namespace create LICENSE_CACHE --env staging
# then add `id = "..."` below. deploy-proxy.yml refuses to deploy staging
# until it is set.
[env.staging]
workers_dev = false
routes = [{ pattern = "staging-api.spec-layer.com", custom_domain = true }]
kv_namespaces = [
  { binding = "LICENSE_CACHE" }
]

[[env.staging.durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaDO"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
