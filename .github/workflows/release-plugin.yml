name: Release plugin

# Builds the Figma plugin from a vX.Y.Z tag, attests the build's provenance,
# and opens a draft GitHub Release carrying the zip, the version's
# CHANGELOG.md section and the checklist a person still owns. Figma has no
# publishing API, so the Community listing is updated by hand from the
# draft; nothing here publishes it. A run by hand builds and uploads the zip
# as a workflow artifact and creates no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release workflow (see release-cli.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: tag
        name: Resolve the release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          else
            tag="v$(node -p "require('./packages/plugin/package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Versions, the dated changelog section, and the proxy origin in both
      # the manifest and the UI.
      - name: Tag, versions, changelog and proxy origin agree
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/check-release.mjs plugin "$TAG" --notes "$RUNNER_TEMP/notes.md"
      - run: npm ci
      # check:ci builds the plugin, so dist/ below is the tested build.
      - run: npm run check:ci
      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release
          cd packages/plugin
          # Fixed timestamps and order, so the same commit zips to the same bytes.
          epoch="$(git log -1 --format=%ct)"
          find manifest.json dist -exec touch -d "@$epoch" {} +
          find manifest.json dist -type f | LC_ALL=C sort | zip -X -q "../../release/spec-layer-plugin-$TAG.zip" -@
          cd ../..
          cp "$RUNNER_TEMP/notes.md" release/notes.md
          unzip -l "release/spec-layer-plugin-$TAG.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      # A draft, never a published release: the manual Figma pass and the
      # delivery order in its checklist come first.
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip \
            --draft --verify-tag \
            --title "Spec Layer $TAG" \
            --notes-file release/notes.md
