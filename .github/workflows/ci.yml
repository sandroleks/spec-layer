name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here writes to the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same branch or pull request, but never
# cancel a run on main: those are the ones a release is judged against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job id is the required status check context on main. Do not rename it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the secret scan can read every commit in a pull
          # request, not only the merge result.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # check:ci scans the tree as it would merge. This reads each pushed
      # commit too: a key added and deleted again inside the pull request is
      # still public on the branch and still needs rotating.
      - name: Secret scan (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-secrets.mjs --range "$BASE_SHA" "$HEAD_SHA"
      - run: npm run check:ci

  # The CLI runs on developers' machines, not only on Linux under Node 22:
  # its CRLF marker handling, 0600 credential file, directory renames and git
  # spawn behave differently on Windows and macOS. This runs the shipped
  # bundle and the CLI's own tests on every platform and supported Node. The
  # rest of the gate stays in verify.
  cli-portability:
    name: cli-portability (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: npm run check:cli-bundle
      - run: npx vitest run packages/cli

  # New or changed dependencies are checked against the advisory database
  # and the licence allow-list before they merge. npm audit in check:ci
  # covers the whole tree; this names what a pull request itself introduces.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          # Every licence the lockfile carries today. LGPL-3.0-or-later is the
          # prebuilt libvips in sharp, reached only through wrangler (dev).
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            BlueOak-1.0.0, CC0-1.0, MPL-2.0, Python-2.0, LGPL-3.0-or-later
          # @figma/plugin-typings ships a verbatim MIT LICENSE file but declares
          # `"license": "MIT License"`, a string that is not an SPDX id, so
          # GitHub reports it as LicenseRef-bad-mit-license and every version
          # bump fails the licence gate. The text is MIT (checked 1.128.0 and
          # 1.140.0, identical); the exemption is for the metadata, not the terms.
          allow-dependencies-licenses: pkg:npm/%40figma/plugin-typings

  # The delivery chain is code too: every workflow change is linted for
  # injection, excess permissions, credential persistence and unpinned
  # actions before it can merge. Advisory until it is made a required check.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Findings fail the job in the log; nothing is uploaded, so the job
          # needs no security-events permission.
          advanced-security: false
